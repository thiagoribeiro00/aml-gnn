version: '3.8'

services:
  aml-gnn:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: aml-gnn-app
    volumes:
      - ../data:/app/data
      - ../models:/app/models
      - ../mlruns:/app/mlruns
    env_file:
      - ../.env
    environment:
      - ENVIRONMENT=prod
      - LOG_LEVEL=INFO
    networks:
      - aml-network

  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    container_name: mlflow-server
    ports:
      - "5000:5000"
    volumes:
      - ../mlruns:/mlflow/mlruns
    command: mlflow ui --host 0.0.0.0
    networks:
      - aml-network

networks:
  aml-network:
    driver: bridge
